<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contact | Mirza Dugopoljac</title>
  <meta name="theme-color" content="#211713">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
    rel="stylesheet"
  >

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="./assets/css/site.css">

  <!-- Prevent transition flash between internal pages -->
  <script>
    (() => {
      try {
        if (sessionStorage.getItem("mirza-transition") === "1") {
          document.documentElement.classList.add("transition-pending");

          setTimeout(() => {
            document.documentElement.classList.remove("transition-pending");
          }, 1800);
        }
      } catch (error) {
        // Ignore sessionStorage errors.
      }
    })();
  </script>
</head>

<body
  data-root="./"
  data-active="contact"
  data-title-key="title.contact"
>
  <!-- Hero -->
  <header class="hero">
    <div class="texture"></div>

    <div class="hero-center hero-shell">
      <div class="kicker">
        <span data-i18n="contact.kicker"></span>
        <i></i>
        <span>Bursa · Türkiye</span>
      </div>

      <h1 data-i18n="contact.title"></h1>

      <p
        class="hero-copy"
        data-i18n="contact.copy"
      ></p>

      <div class="actions">
        <a
          class="btn primary"
          href="mailto:mirzaadc@gmail.com"
          data-cursor="EMAIL"
        >
          mirzaadc@gmail.com ↗
        </a>

        <a
          class="btn secondary"
          href="portfolio/index.html"
          data-transition
          data-i18n="common.viewWork"
        ></a>
      </div>
    </div>
  </header>

  <!-- Contact options -->
  <section class="section">
    <div class="paper-texture"></div>

    <div class="shell">
      <div class="section-head reveal">
        <div
          class="section-label"
          data-i18n="contact.section"
        ></div>

        <h2
          class="section-title"
          data-i18n="contact.sectionTitle"
        ></h2>
      </div>

      <div class="contact-grid">
        <!-- Email -->
        <article class="contact-main reveal">
          <small>Email</small>

          <h2 data-i18n="contact.emailTitle"></h2>
          <p data-i18n="contact.emailP"></p>

          <div class="contact-email">
            <a href="mailto:mirzaadc@gmail.com">
              mirzaadc@gmail.com
            </a>

            <button
              class="copy"
              id="copyEmail"
              type="button"
              data-i18n="contact.copyButton"
            ></button>
          </div>
        </article>

        <!-- Social links -->
        <div class="stack">
          <a
            class="contact-card reveal"
            href="https://www.linkedin.com/in/mirzadugopoljac/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <small>LinkedIn</small>
            <span class="go">↗</span>

            <h3 data-i18n="contact.linkedinTitle"></h3>
            <p data-i18n="contact.linkedinP"></p>
          </a>

          <a
            class="contact-card reveal"
            href="https://github.com/MirzaDugopoljac"
            target="_blank"
            rel="noopener noreferrer"
          >
            <small>GitHub</small>
            <span class="go">↗</span>

            <h3 data-i18n="contact.githubTitle"></h3>
            <p data-i18n="contact.githubP"></p>
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="cta-wrap">
    <div class="shell">
      <div class="cta reveal">
        <div class="texture"></div>

        <h2 data-i18n="contact.footerCta"></h2>

        <div class="cta-side">
          <p data-i18n="contact.footerText"></p>

          <div class="cta-links">
            <a
              href="./portfolio/index.html"
              data-transition
              data-i18n="common.viewWork"
            ></a>

            <a
              href="./contact.html"
              data-transition
              data-i18n="common.contact"
            ></a>
          </div>
        </div>
      </div>

      <footer>
        <span>© 2026 Mirza Dugopoljac</span>
        <span data-i18n="common.footer"></span>
      </footer>
    </div>
  </section>

  <!-- Scripts -->
  <script src="./assets/js/i18n.js"></script>
  <script src="./assets/js/projects.js"></script>
  <script src="./assets/js/components.js"></script>
  <script src="./assets/js/site.js"></script>
</body>
</html>
