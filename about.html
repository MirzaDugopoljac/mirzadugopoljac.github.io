<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>About | Mirza Dugopoljac</title>
  <meta name="theme-color" content="#211713">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
    rel="stylesheet"
  >

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="./assets/css/site.css">

  <!-- Prevent transition flash between internal pages -->
  <script>
    (() => {
      try {
        if (sessionStorage.getItem("mirza-transition") === "1") {
          document.documentElement.classList.add("transition-pending");

          setTimeout(() => {
            document.documentElement.classList.remove("transition-pending");
          }, 1800);
        }
      } catch (error) {
        // Ignore sessionStorage errors.
      }
    })();
  </script>
</head>

<body
  data-root="./"
  data-active="about"
  data-title-key="title.about"
>
  <!-- Hero -->
  <header class="hero">
    <div class="texture"></div>

    <div class="hero-center hero-shell">
      <div class="kicker">
        <span data-i18n="about.kicker"></span>
        <i></i>
        <span>Bursa · Türkiye</span>
      </div>

      <h1 data-i18n="about.title"></h1>

      <p
        class="hero-copy"
        data-i18n="about.copy"
      ></p>
    </div>
  </header>

  <!-- About / Position -->
  <section class="section">
    <div class="paper-texture"></div>

    <div class="shell">
      <div class="section-head reveal">
        <div
          class="section-label"
          data-i18n="about.section1"
        ></div>

        <h2
          class="section-title"
          data-i18n="about.section1Title"
        ></h2>
      </div>

      <div class="statement-grid">
        <article class="statement reveal">
          <blockquote data-i18n="about.quote"></blockquote>
          <p data-i18n="about.quoteP"></p>
        </article>

        <div class="stack">
          <article class="mini-card reveal">
            <small data-i18n="about.card1"></small>
            <strong data-i18n="about.card1b"></strong>
          </article>

          <article class="mini-card reveal">
            <small data-i18n="about.card2"></small>
            <strong data-i18n="about.card2b"></strong>
          </article>
        </div>
      </div>
    </div>
  </section>

  <!-- Working method -->
  <section class="section alt">
    <div class="paper-texture"></div>

    <div class="shell">
      <div class="section-head reveal">
        <div
          class="section-label"
          data-i18n="about.section2"
        ></div>

        <h2
          class="section-title"
          data-i18n="about.section2Title"
        ></h2>
      </div>

      <div class="process-grid">
        <article class="process reveal">
          <small>01 / READ</small>
          <h3 data-i18n="home.p1"></h3>
          <p data-i18n="home.p1p"></p>
        </article>

        <article class="process reveal">
          <small>02 / TEST</small>
          <h3 data-i18n="home.p2"></h3>
          <p data-i18n="home.p2p"></p>
        </article>

        <article class="process reveal">
          <small>03 / REFINE</small>
          <h3 data-i18n="home.p3"></h3>
          <p data-i18n="home.p3p"></p>
        </article>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="cta-wrap">
    <div class="shell">
      <div class="cta reveal">
        <div class="texture"></div>

        <h2 data-i18n="about.footerCta"></h2>

        <div class="cta-side">
          <p data-i18n="about.footerText"></p>

          <div class="cta-links">
            <a
              href="./portfolio/index.html"
              data-transition
              data-i18n="common.viewWork"
            ></a>

            <a
              href="./contact.html"
              data-transition
              data-i18n="common.contact"
            ></a>
          </div>
        </div>
      </div>

      <footer>
        <span>© 2026 Mirza Dugopoljac</span>
        <span data-i18n="common.footer"></span>
      </footer>
    </div>
  </section>

  <!-- Scripts -->
  <script src="./assets/js/i18n.js"></script>
  <script src="./assets/js/projects.js"></script>
  <script src="./assets/js/components.js"></script>
  <script src="./assets/js/site.js"></script>
</body>
</html>
