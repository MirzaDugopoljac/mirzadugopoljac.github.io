<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mirza Dugopoljac | Landscape Architecture</title>
  <meta name="theme-color" content="#211713">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
    rel="stylesheet"
  >

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="./assets/css/site.css">

  <!-- Prevent transition flash between internal pages -->
  <script>
    (() => {
      try {
        if (sessionStorage.getItem("mirza-transition") === "1") {
          document.documentElement.classList.add("transition-pending");

          setTimeout(() => {
            document.documentElement.classList.remove("transition-pending");
          }, 1800);
        }
      } catch (error) {
        // Ignore sessionStorage errors.
      }
    })();
  </script>
</head>

<body
  data-root="./"
  data-active="home"
  data-title-key="title.home"
>
  <!-- Hero -->
  <header class="hero">
    <div class="texture"></div>

    <div class="hero-center hero-shell">
      <div class="kicker">
        <span data-i18n="home.kicker"></span>
        <i></i>
        <span>Bursa · Türkiye</span>
      </div>

      <h1 data-i18n="home.title"></h1>

      <p
        class="hero-copy"
        data-i18n="home.copy"
      ></p>

      <div class="actions">
        <a
          class="btn primary"
          href="portfolio/index.html"
          data-transition
          data-i18n="home.ctaWork"
        ></a>

        <a
          class="btn secondary"
          href="about.html"
          data-transition
          data-i18n="home.ctaAbout"
        ></a>
      </div>

      <div class="hero-chips">
        <span data-i18n="home.chipDesign"></span>
        <span data-i18n="home.chipPlanning"></span>
        <span>GIS</span>
        <span data-i18n="home.chipVisualization"></span>
      </div>
    </div>
  </header>

  <!-- Stats -->
  <section class="strip">
    <div class="strip-grid shell">
      <div class="strip-cell strip-lead">
        <h2 data-i18n="home.bandTitle"></h2>
        <p data-i18n="home.bandText"></p>
      </div>

      <div class="strip-cell">
        <strong class="big">07</strong>
        <small data-i18n="home.statProjects"></small>
      </div>

      <div class="strip-cell">
        <strong class="big">03</strong>
        <small data-i18n="home.statLanguages"></small>
      </div>

      <div class="strip-cell">
        <strong class="big">LA</strong>
        <small data-i18n="home.statLandscape"></small>
      </div>
    </div>
  </section>

  <!-- Process -->
  <section class="section">
    <div class="paper-texture"></div>

    <div class="shell">
      <div class="section-head reveal">
        <div
          class="section-label"
          data-i18n="home.section1"
        ></div>

        <h2
          class="section-title"
          data-i18n="home.section1Title"
        ></h2>
      </div>

      <div class="process-grid">
        <article class="process reveal">
          <small>01 / READ</small>
          <h3 data-i18n="home.p1"></h3>
          <p data-i18n="home.p1p"></p>
        </article>

        <article class="process reveal">
          <small>02 / TEST</small>
          <h3 data-i18n="home.p2"></h3>
          <p data-i18n="home.p2p"></p>
        </article>

        <article class="process reveal">
          <small>03 / SHAPE</small>
          <h3 data-i18n="home.p3"></h3>
          <p data-i18n="home.p3p"></p>
        </article>
      </div>
    </div>
  </section>

  <!-- Selected projects -->
  <section class="section alt">
    <div class="paper-texture"></div>

    <div class="shell">
      <div class="section-head reveal">
        <div
          class="section-label"
          data-i18n="home.section2"
        ></div>

        <h2
          class="section-title"
          data-i18n="home.section2Title"
        ></h2>
      </div>

      <div
        class="projects"
        id="homeProjects"
      ></div>
    </div>
  </section>

  <!-- CTA -->
  <section class="cta-wrap">
    <div class="shell">
      <div class="cta reveal">
        <div class="texture"></div>

        <h2 data-i18n="home.footerCta"></h2>

        <div class="cta-side">
          <p data-i18n="home.footerText"></p>

          <div class="cta-links">
            <a
              href="./portfolio/index.html"
              data-transition
              data-i18n="common.viewWork"
            ></a>

            <a
              href="./contact.html"
              data-transition
              data-i18n="common.contact"
            ></a>
          </div>
        </div>
      </div>

      <footer>
        <span>© 2026 Mirza Dugopoljac</span>
        <span data-i18n="common.footer"></span>
      </footer>
    </div>
  </section>

  <!-- Scripts -->
  <script src="./assets/js/i18n.js"></script>
  <script src="./assets/js/projects.js"></script>
  <script src="./assets/js/components.js"></script>
  <script src="./assets/js/site.js"></script>
</body>
</html>
