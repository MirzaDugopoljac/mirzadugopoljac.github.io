<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Portfolio | Mirza Dugopoljac</title>
  <meta name="theme-color" content="#211713">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
    rel="stylesheet"
  >

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="../assets/css/site.css">

  <!-- Prevent transition flash between internal pages -->
  <script>
    (() => {
      try {
        if (sessionStorage.getItem("mirza-transition") === "1") {
          document.documentElement.classList.add("transition-pending");

          setTimeout(() => {
            document.documentElement.classList.remove("transition-pending");
          }, 1800);
        }
      } catch (error) {
        // Ignore sessionStorage errors.
      }
    })();
  </script>
</head>

<body
  data-root="../"
  data-active="work"
  data-title-key="title.portfolio"
>
  <!-- Hero -->
  <header class="hero">
    <div class="texture"></div>

    <div class="hero-center hero-shell">
      <div class="kicker">
        <span data-i18n="portfolio.kicker"></span>
        <i></i>
        <span>Landscape Architecture</span>
      </div>

      <h1 data-i18n="portfolio.title"></h1>

      <p
        class="hero-copy"
        data-i18n="portfolio.copy"
      ></p>

      <div class="actions">
        <a
          class="btn primary"
          href="#projects"
          data-i18n="portfolio.projectsCta"
        ></a>

        <a
          class="btn secondary"
          href="../assets/Mirza-Dugopoljac-Portfolio.pdf"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="common.pdf"
        ></a>
      </div>
    </div>

    <!-- Portfolio hero images -->
    <div class="portfolio-hero-art">
      <div class="folio-img a">
        <img
          src="../assets/img/square-render-2.webp"
          alt="Urban Square project visualization"
        >
      </div>

      <div class="folio-img b">
        <img
          src="../assets/img/planning-natural-1.webp"
          alt="Urban landscape planning analysis"
        >
      </div>

      <div class="folio-img c">
        <img
          src="../assets/img/residential-render-2.webp"
          alt="Single residence landscape visualization"
        >
      </div>
    </div>
  </header>

  <!-- Projects -->
  <section
    class="section alt"
    id="projects"
  >
    <div class="paper-texture"></div>

    <div class="shell">
      <div class="section-head reveal">
        <div
          class="section-label"
          data-i18n="portfolio.section"
        ></div>

        <div>
          <h2
            class="section-title"
            data-i18n="portfolio.sectionTitle"
          ></h2>

          <p
            style="max-width: 650px; color: var(--muted); line-height: 1.7;"
            data-i18n="portfolio.sectionText"
          ></p>
        </div>
      </div>

      <div
        class="projects"
        id="projectList"
      ></div>
    </div>
  </section>

  <!-- CTA -->
  <section class="cta-wrap">
    <div class="shell">
      <div class="cta reveal">
        <div class="texture"></div>

        <h2 data-i18n="portfolio.footerCta"></h2>

        <div class="cta-side">
          <p data-i18n="portfolio.footerText"></p>

          <div class="cta-links">
            <a
              href="../portfolio/index.html"
              data-transition
              data-i18n="common.viewWork"
            ></a>

            <a
              href="../contact.html"
              data-transition
              data-i18n="common.contact"
            ></a>
          </div>
        </div>
      </div>

      <footer>
        <span>© 2026 Mirza Dugopoljac</span>
        <span data-i18n="common.footer"></span>
      </footer>
    </div>
  </section>

  <!-- Scripts -->
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/projects.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/portfolio.js"></script>
</body>
</html>
